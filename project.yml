name: SonosArc
options:
  bundleIdPrefix: com.mba13
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0"
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: targeted
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  SonosArc:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "*.entitlements"
      - path: Shared
      - path: Intents
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mba13.sonosarc
        PRODUCT_NAME: SonosArc
        INFOPLIST_KEY_CFBundleDisplayName: Sonos Arc
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Arc looks for your Sonos speaker on Wi-Fi to read and change Night Mode and Speech Enhancement.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_ENTITLEMENTS: App/SonosArc.entitlements
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_TESTABILITY: YES
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    entitlements:
      path: App/SonosArc.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.mba13.sonosarc
    dependencies:
      - target: ArcWidget
        embed: true
        codeSign: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Sonos Arc
        NSLocalNetworkUsageDescription: Arc looks for your Sonos speaker on Wi-Fi to read and change Night Mode and Speech Enhancement.
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  ArcWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
        excludes:
          - "*.entitlements"
      - path: Shared
      - path: Intents
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mba13.sonosarc.widget
        PRODUCT_NAME: ArcWidget
        CODE_SIGN_ENTITLEMENTS: Widget/ArcWidget.entitlements
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        INFOPLIST_KEY_CFBundleDisplayName: Arc Modes
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        APPLICATION_EXTENSION_API_ONLY: YES
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    entitlements:
      path: Widget/ArcWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.mba13.sonosarc
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Arc Modes
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: AppIntents.framework
  SonosArcTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mba13.sonosarc.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SonosArc.app/SonosArc"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: SonosArc
schemes:
  SonosArc:
    build:
      targets:
        SonosArc: all
        ArcWidget: all
        SonosArcTests:
          - test
    test:
      gatherCoverageData: false
      targets:
        - SonosArcTests
